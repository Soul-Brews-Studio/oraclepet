# The OraclePet pairing relay: two peers meet on a room named by their pairing code, swap
# encrypted WebRTC offers/answers, then talk peer to peer. Nothing is stored.
name = "oraclepet-signal"
main = "worker.js"
compatibility_date = "2026-11-01"
account_id = "a5eabdc2b11aae9bd5af46bd6a88179e"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
