; esp32-fleet-pulse — WiFi + HTTPClient + ArduinoJson session-list on an LCD.
; The embedded sibling of HomekeeperWidget's SessionPulse: an ESP32-S3 polls a
; maw backend (/api/ls) every ~5s and renders the live session list on-screen.
;
; Board env copied VERBATIM from the proven jc3248-pet env (Guition JC3248W535,
; ESP32-S3 + AXS15231 320x480 QSPI). GIF/audio libs dropped; WiFi/HTTP/JSON added.
; WiFi.h + HTTPClient.h ship in the Arduino-ESP32 core — no lib_dep entry needed.
;
; Do NOT add any second BOARD_* define. -DBOARD_JC3248W535C=1 alone selects the
; axs15231_qspi.h HAL; a dual board-define is what dragged the buddy's M5 HAL in.

[platformio]
default_envs = jc3248-fleet

[env:jc3248-fleet]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = no_ota.csv          ; built-in PlatformIO scheme (no local file needed)
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_JC3248W535C=1          ; selects axs15231_qspi.h
    -DLGFX_USE_V1=1
    -DLGFX_USE_QSPI=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial -> native USB CDC
    -DBOARD_HAS_PSRAM=1            ; sprite framebuffer lives in PSRAM

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0    ; sprite framebuffer + text
    bblanchon/ArduinoJson @ ^7.0.0 ; v7 JsonDocument + Filter
    ; WiFi.h + HTTPClient.h are bundled in the Arduino-ESP32 core — no entry needed
