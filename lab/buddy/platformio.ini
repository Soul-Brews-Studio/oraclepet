[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_M5STICKC_PLUS=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:atd35-s3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_ATD35_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:wt32-sc01-plus]
; Wireless-Tag/Panlee WT32-SC01 Plus — ESP32-S3 N16R2, ST7796 8080 parallel + FT6336U
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi   ; 2MB QUAD psram (not octal)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WT32_SC01_PLUS=1
    -DBOARD_ATD35_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:lilygo-epd47]
platform = espressif32 @ ^6.9.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_LILYGO_EPD47=1
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_EPD_DISPLAY_TYPE_ED047TC1=1
    -DCONFIG_EPD_BOARD_REVISION_V6=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    vroland/epdiy @ ^1.0.0
    bblanchon/ArduinoJson @ ^7.0.0

[env:waveshare-2_8b]
; Waveshare ESP32-S3-LCD-2.8B (480x640 RGB, ST7701S, TCA9554, no touch)
; 16MB flash, 8MB OPI PSRAM, USB-Serial-JTAG (HWCDC)
; pioarduino = same platform as jc3248w535c: ble_bridge.cpp targets 3.x BLE API.
; Arduino_GFX pinned to 1.4.7 (1.5.x caused blank RGB panels on S3).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_WAVESHARE_2_8B=1
    -DBOARD_ATD35_S3=1
    -DLGFX_USE_V1=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
build_src_filter = +<*> +<buddies/>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:c3-hmi]
; MakerAsia C3-HMI — ESP32-C3, ST7789 SPI 240x320 + FT5x06 touch
platform = espressif32
