<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OraclePet · what the pets heard</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --dim: #888; }
  body { font: 15px/1.5 -apple-system, "Sukhumvit Set", "Noto Sans Thai", sans-serif; margin: 0 auto; max-width: 760px; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 13px; }
  .u { border-top: 1px solid var(--line); padding: 12px 0; }
  .u.new { animation: hl 2s ease-out; }
  @keyframes hl { from { background: #f5c54233; } to { background: transparent; } }
  .meta { color: var(--dim); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .text { font-size: 17px; margin: 4px 0 6px; min-height: 1.5em; }
  .text.none { color: var(--dim); font-style: italic; font-size: 14px; }
  audio { width: 100%; height: 32px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<h1>What the pets heard</h1>
<p class="sub" id="sub">newest first · saved on this Mac</p>
<div id="list"><p class="empty">Nothing yet. Turn on voice mode on a pet and speak.</p></div>
<script>
const list = document.getElementById('list');
const seen = new Map();
function row(u, isNew) {
  const d = document.createElement('div');
  d.className = 'u' + (isNew ? ' new' : '');
  const t = new Date(u.start);
  const text = u.text == null ? 'transcribing… (or no Paxa key)' : (u.text || '(no words)');
  d.innerHTML = `<div class="meta"><b>${esc(u.pet)}</b><span>${t.toLocaleString('th-TH')}</span>
    <span>${u.seconds} s</span><span>rms ${u.rms} · peak ${u.peak}</span><span>${esc(u.reason)}</span></div>
    <div class="text ${u.text ? '' : 'none'}">${esc(text)}</div>
    <audio controls preload="none" src="/audio/${encodeURI(u.file)}"></audio>`;
  return d;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function put(u, isNew) {
  const old = seen.get(u.file), el = row(u, isNew && !old);
  if (old) old.replaceWith(el); else { list.querySelector('.empty')?.remove(); list.prepend(el); }
  seen.set(u.file, el);
}
fetch('/api/utterances').then(r => r.json()).then(us => { us.reverse().forEach(u => put(u, false)); });
(function feed() {
  const ws = new WebSocket(`ws://${location.host}/feed`);
  ws.onmessage = e => put(JSON.parse(e.data), true);
  ws.onclose = () => setTimeout(feed, 2000);
})();
</script>
</body>
</html>
