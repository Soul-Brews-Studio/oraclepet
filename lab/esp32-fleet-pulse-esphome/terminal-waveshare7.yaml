# terminal-waveshare7.yaml — ESPHome + LVGL terminal viewer for the Waveshare
# ESP32-S3-Touch-LCD-7 (NO B suffix) — 800×480 RGB-parallel, GT911 touch,
# CH422G IO expander (NOT CH32V003).
#
# Sibling of:
#   • terminal.yaml             — JC3248W535 QSPI 320×480 portrait
#   • terminal-waveshare7b.yaml — Waveshare 7B 1024×600 + CH32V003 (different board)
#
# All display-AGNOSTIC logic from terminal.yaml is preserved verbatim — the ANSI→
# LVGL recolor lambda, JetBrains Mono + Sarabun Thai fonts, dynamic /api/ls pane
# dropdown with FixedVector<const char*>, perf knobs (lv_label_set_text_static +
# VISCOLS clip + trailing-space defer + bottom-pin via blank-line prepend), the
# on-screen IP, the column-offset pan, the table dash-cap, the wrap/clip select.
#
# Differences vs the 7B port:
#   • display: rpi_dpi_rgb 800×480 @ 16MHz (vs mipi_rgb 1024×600 @ 30MHz)
#   • backlight + display-reset + GT911-reset via CH422G built-in component
#     (vs CH32V003 external PR #10071) — simpler + no unmerged dependency
#   • LVGL geometry refit for 800×480 — ~95 cols × ~25 lines @ JetBrains Mono 14
#
# Proof base: laris-co/esphome-fw#fw/18-waveshare-7inch v2 (family's working
# config) + Nat's somtor-meter Arduino_GFX reference (same pins/expander/touch).

substitutions:
  capture_base: "http://192.168.1.109:3456/api/capture?target="
  ls_url: "http://192.168.1.109:3456/api/ls"

esphome:
  name: oracle-term-7
  friendly_name: Oracle Terminal 7
  comment: "800x480 RGB — LVGL tmux pane viewer (plain Waveshare 7)"
  on_boot:
    - priority: -100
      then:
        - script.execute: refresh_panes
        - script.execute: poll_loop

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Free INTERNAL DRAM by relocating instructions + read-only data to PSRAM,
    # and widen the data cache for the RGB DMA path. Without this, the 800x480
    # RGB framebuffer + LVGL buffers leave too little internal heap, and the
    # fetch_pane JSON callback's std::string allocations fail -> operator new
    # returns NULL -> __cxa_allocate_exception -> abort() (decoded from the
    # real backtrace: terminal-waveshare7.yaml:413 -> json::parse_json ->
    # operator new). These keys are the family-proven set from
    # laris-co/esphome-fw fw/18-waveshare-7inch v2 on THIS exact board.
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # Route app logs AND the ESP-IDF panic backtrace to physical UART0 (GPIO43 TX),
  # which is wired to the CH343 bridge → the usbmodem5AAF / wchusbserial port the
  # operator is actually watching. USB_SERIAL_JTAG sent them to the native USB
  # port instead, hiding every panic. UART0 makes the crash readable.
  hardware_uart: UART0
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Browser control surface (dropdown to pick the pane, status, etc.)
web_server:
  port: 80
  version: 3

http_request:
  id: http_client
  timeout: 12s
  verify_ssl: false
  useragent: esp32-oracle-term-7/1.0
  buffer_size_rx: 4096             # bigger rx chunks for the ~20KB+ capture

# ── Plain-7: CH422G IO expander on the shared I2C bus.
# Drives display reset, GT911 reset, and the backlight enable pin. Built into
# ESPHome (component name `ch422g`) — NO external_components needed. ──────────
i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO09
    scan: true

ch422g:
  - id: ch422g_hub

# The pane the viewer mirrors. Changed live via the select below.
globals:
  - id: target
    type: std::string
    restore_value: no
    initial_value: '"52-esp32:esp32-exp"'
  - id: interval_s
    type: int
    restore_value: no
    initial_value: '3'
  - id: lines_n
    type: int
    restore_value: no
    initial_value: '25'           # 800×480 fits 25 lines at JetBrains 14
  - id: col_off
    type: int
    restore_value: no
    initial_value: '1'            # drop the leading undisplayable marker char by default
  - id: dash_cap
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_ip
    type: std::string
    restore_value: no
    initial_value: '""'

# Pick the pane from the web UI (and Home Assistant).
# NOTE: maw /api/capture resolves the ":suffix" by WINDOW NAME, not index — so
# "52-esp32:2" silently falls back to window 1. Targets MUST be session:windowname.
# (Root fix belongs in maw: make /api/capture accept a numeric window index.)
select:
  - platform: template
    id: pane_select
    name: "Pane"
    optimistic: true
    initial_option: "52-esp32:esp32-exp"
    options:
      - "52-esp32:esp32-oracle"
      - "52-esp32:esp32-exp"
      - "04-homekeeper:homekeeper-oracle"
      - "11-odin:odin-oracle"
      - "12-mother:mother-oracle"
      - "14-xiaoer:xiaoer-oracle"
      - "146-ccc:ccc-oracle"
      - "77-mawjs:mawjs-oracle"
      - "01-pulse:pulse-oracle"
    on_value:
      then:
        - lambda: 'id(target) = x;'
        - logger.log:
            format: "[term] target -> %s"
            args: ['x.c_str()']
  - platform: template
    name: "Font size"
    id: font_select
    optimistic: true
    initial_option: "medium"
    options:
      - "small"
      - "medium"
      - "large"
    on_value:
      then:
        - lambda: |-
            const lv_font_t *f = (x == "small") ? id(term_sm).get_lv_font()
                               : (x == "large") ? id(term_lg).get_lv_font()
                               : id(term_md).get_lv_font();
            lv_obj_set_style_text_font(id(term), f, 0);
            // 800×480 with a 24px-reserved header → term-box height = 452.
            // JetBrains Mono line-height ≈ 1.25 * size; per-size fit:
            // sm(11)≈14px → 32, md(14)≈18px → 25, lg(16)≈20px → 22.
            int fit = (x == "small") ? 32 : (x == "large") ? 22 : 25;
            id(lines_n) = fit;
            id(num_lines).publish_state(fit);      // keep the web-UI slider in sync
        - script.execute: fetch_pane               # re-render immediately at the new line count
  - platform: template
    name: "Wrap mode"
    id: wrap_select
    optimistic: true
    initial_option: "clip"
    options:
      - "clip"
      - "wrap"
    on_value:
      then:
        - lambda: |-
            lv_label_set_long_mode(id(term),
              (x == "wrap") ? LV_LABEL_LONG_MODE_WRAP : LV_LABEL_LONG_MODE_CLIP);
            lv_obj_invalidate(id(term));

# ── Plain-7 backlight: simple GPIO via CH422G pin 2 (on/off).
# The plain 7 does NOT support PWM brightness — backlight is just enable.
# (The 7B uses CH32V003 PWM; the 7 uses the CH422G discrete enable line.) ────
switch:
  - platform: gpio
    id: lcd_backlight
    name: "LCD Backlight"
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

# ── Touchscreen: GT911 (INT GPIO4, RST via CH422G pin 1) ────────────────────
# Note: the GT911 component has NO reset_pin field on the plain 7 — the CH422G
# init sequence resets it as part of board power-on (write 0x14 → wiggle GPIO4
# → write 0x1E). ESPHome's ch422g + gt911 components handle this automatically
# when both are present in the config.
touchscreen:
  platform: gt911
  id: my_touchscreen
  display: lcd
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT

# ── RGB display (rpi_dpi_rgb, 800×480 @ 16MHz, pclk inverted) ─────────────
# From laris-co/esphome-fw fw/18-waveshare-7inch v2.yaml — family-proven plain-7
# config. Cross-checked against Nat's somtor-meter Arduino_GFX reference (same
# pins/porches/expander). pclk 16MHz is the conservative number Waveshare and
# the family both ship (vs 30MHz aggressive aim on the 7B).
display:
  - platform: rpi_dpi_rgb
    id: lcd
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1   # r3
        - 2   # r4
        - 42  # r5
        - 41  # r6
        - 40  # r7
      blue:
        - 14  # b3
        - 38  # b4
        - 18  # b5
        - 17  # b6
        - 10  # b7
      green:
        - 39  # g2
        - 0   # g3
        - 45  # g4
        - 48  # g5
        - 47  # g6
        - 21  # g7

# ── Body fonts: JetBrains Mono (Latin monospace) + Sarabun Thai via `extras` ──
# 3 sizes for the Font-size select; Thai renders at any size, ASCII stays mono.
font:
  - file: { type: gfonts, family: "JetBrains Mono" }
    id: term_sm
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    extras:
      - file: { type: gfonts, family: "Sarabun" }
        glyphs: ["ก","ข","ฃ","ค","ฅ","ฆ","ง","จ","ฉ","ช","ซ","ฌ","ญ","ฎ","ฏ","ฐ","ฑ","ฒ","ณ","ด","ต","ถ","ท","ธ","น","บ","ป","ผ","ฝ","พ","ฟ","ภ","ม","ย","ร","ฤ","ล","ฦ","ว","ศ","ษ","ส","ห","ฬ","อ","ฮ","ฯ","ะ","ั","า","ำ","ิ","ี","ึ","ื","ุ","ู","ฺ","฿","เ","แ","โ","ใ","ไ","ๅ","ๆ","็","่","้","๊","๋","์","ํ","๎","๏","๐","๑","๒","๓","๔","๕","๖","๗","๘","๙","๚","๛"]
  - file: { type: gfonts, family: "JetBrains Mono" }
    id: term_md
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    extras:
      - file: { type: gfonts, family: "Sarabun" }
        glyphs: ["ก","ข","ฃ","ค","ฅ","ฆ","ง","จ","ฉ","ช","ซ","ฌ","ญ","ฎ","ฏ","ฐ","ฑ","ฒ","ณ","ด","ต","ถ","ท","ธ","น","บ","ป","ผ","ฝ","พ","ฟ","ภ","ม","ย","ร","ฤ","ล","ฦ","ว","ศ","ษ","ส","ห","ฬ","อ","ฮ","ฯ","ะ","ั","า","ำ","ิ","ี","ึ","ื","ุ","ู","ฺ","฿","เ","แ","โ","ใ","ไ","ๅ","ๆ","็","่","้","๊","๋","์","ํ","๎","๏","๐","๑","๒","๓","๔","๕","๖","๗","๘","๙","๚","๛"]
  - file: { type: gfonts, family: "JetBrains Mono" }
    id: term_lg
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    extras:
      - file: { type: gfonts, family: "Sarabun" }
        glyphs: ["ก","ข","ฃ","ค","ฅ","ฆ","ง","จ","ฉ","ช","ซ","ฌ","ญ","ฎ","ฏ","ฐ","ฑ","ฒ","ณ","ด","ต","ถ","ท","ธ","น","บ","ป","ผ","ฝ","พ","ฟ","ภ","ม","ย","ร","ฤ","ล","ฦ","ว","ศ","ษ","ส","ห","ฬ","อ","ฮ","ฯ","ะ","ั","า","ำ","ิ","ี","ึ","ื","ุ","ู","ฺ","฿","เ","แ","โ","ใ","ไ","ๅ","ๆ","็","่","้","๊","๋","์","ํ","๎","๏","๐","๑","๒","๓","๔","๕","๖","๗","๘","๙","๚","๛"]

# ── LVGL: header + one big monospace terminal label ───────────────
lvgl:
  displays:
    - lcd
  buffer_size: 15%                # trimmed from 25% — frees internal DRAM for the fetch_pane string allocs (OOM-abort fix)
  bg_color: 0x000000
  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      pad_all: 2
      widgets:
        - label:
            id: hdr
            align: TOP_LEFT
            x: 4
            y: 2
            text_font: montserrat_14     # header stays English
            text_color: 0x07E7FF
            text: "oracle-term-7  connecting..."
        - label:
            id: term
            align: TOP_LEFT              # fixed top-anchored viewport — newest line bottom-pinned via blank-line padding in fetch_pane
            x: 2
            y: 24                        # just below the montserrat_14 header
            width: 796                   # fixed viewport (800-4px margin) — CLIP bounds text cleanly; no SIZE_CONTENT off-screen growth (the CLIP/WRAP gotcha)
            height: 452                  # 480 - y(24) - 4px margin; stable on-screen box so CLIP renders (LVGL re-anchors only WRAP)
            text_font: term_md           # JetBrains Mono + Thai (medium); swapped by the Font-size select
            text_color: 0xC8C8C8
            recolor: true                # enable #RRGGBB ..# markup (ANSI colors)
            text_align: LEFT             # flush-left (default auto-centered the short lines)
            long_mode: CLIP              # never wrap — terminal alignment
            text: ""

# ── Web-UI widgets (auto-render in the :80 ESPHome web UI) ─────────
number:
  - platform: template
    name: "Refresh interval (s)"
    id: num_interval
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 3
    on_value:
      - lambda: 'id(interval_s) = (int) x;'
  - platform: template
    name: "Visible lines"
    id: num_lines
    optimistic: true
    min_value: 8
    max_value: 36                # sm ceiling is 32; cap a touch above for headroom
    step: 1
    initial_value: 25
    on_value:
      - lambda: 'id(lines_n) = (int) x;'
  - platform: template
    name: "Column offset"
    id: num_coff
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1                      # 1-col precision — trim a leading marker char
    initial_value: 1             # default: drop the leading undisplayable marker
    on_value:
      - lambda: 'id(col_off) = (int) x;'
  - platform: template
    name: "Table dash cap"
    id: num_dcap
    optimistic: true
    min_value: 0                 # 0 = off (show full); N = collapse ruler runs longer than N
    max_value: 20
    step: 1
    initial_value: 0
    on_value:
      - lambda: 'id(dash_cap) = (int) x;'

button:
  - platform: template
    name: "Refresh now"
    on_press:
      - script.execute: fetch_pane
  - platform: template
    name: "Refresh panes"
    on_press:
      - script.execute: refresh_panes

# Repopulate the pane dropdown from /api/ls every 30s (sessions come and go).
interval:
  - interval: 30s
    then:
      - script.execute: refresh_panes

text_sensor:
  - platform: template
    name: "Status"
    id: txt_status
  - platform: wifi_info
    ip_address:
      name: "IP"
      on_value:
        - lambda: 'id(g_ip) = x;'

# ── Fetch the selected pane → strip ANSI → label. Driven by poll_loop
#    (dynamic interval) + the Refresh-now button. ───────────────────
script:
  - id: fetch_pane
    then:
      - http_request.get:
          url: !lambda 'return std::string("${capture_base}") + id(target);'
          capture_response: true
          max_response_buffer_size: 49152   # capture spikes past 24KB when the pane is busy → IncompleteInput; 48KB headroom
          on_response:
            then:
              - lambda: |-
                  char st[72];
                  snprintf(st, sizeof(st), "%s  (%d B, http %d)",
                           id(target).c_str(), (int) body.length(), response->status_code);
                  id(txt_status).publish_state(st);
                  json::parse_json(body, [](JsonObject root) -> bool {
                    static const uint32_t BASIC[8]  = {0x202020,0xCD4848,0x5CB85C,0xD1B357,0x5C94DB,0xB870C7,0x57B8BD,0xC7C7C7};
                    static const uint32_t BRIGHT[8] = {0x737373,0xF56C66,0x80E080,0xF5DB70,0x80B8F5,0xDB94EB,0x80E6EB,0xF5F5F5};
                    std::string content = root["content"] | "";
                    int want = id(lines_n);
                    int nl = 0; size_t start = 0;
                    for (size_t i = content.size(); i-- > 0; ) {
                      if (content[i] == '\n') { if (++nl >= want) { start = i + 1; break; } }
                    }
                    const char *p = content.c_str() + start;
                    std::string out; out.reserve(content.size() - start + 256);
                    uint32_t cur = 0, span = 0; int lineCol = 0, coff = id(col_off);
                    int dcap = id(dash_cap), runLen = 0; char runCh = 0;
                    int pendingSp = 0; const int VISCOLS = 90;   // 800×480 fits ~95 cols @ JetBrains 14; 90 gives margin
                    while (*p) {
                      unsigned char c = (unsigned char) *p;
                      if (c == 0x1B) {
                        p++;
                        if (*p == '[') {
                          p++;
                          int code[12], n = 0, v = 0; bool have = false;
                          while (*p && !(*p >= '@' && *p <= '~')) {
                            if (*p >= '0' && *p <= '9') { v = v*10 + (*p-'0'); have = true; }
                            else { if (n < 12) code[n++] = have ? v : 0; v = 0; have = false; }
                            p++;
                          }
                          char f = *p; if (*p) p++;
                          if (f == 'm') {
                            if (have && n < 12) code[n++] = v;
                            if (n == 0) cur = 0;
                            for (int i = 0; i < n; i++) {
                              int cc = code[i];
                              if (cc == 0 || cc == 39) cur = 0;
                              else if (cc >= 30 && cc <= 37) cur = BASIC[cc-30];
                              else if (cc >= 90 && cc <= 97) cur = BRIGHT[cc-90];
                              else if (cc == 38 && i+2 < n && code[i+1] == 5) {
                                int x = code[i+2];
                                if (x < 8) cur = BASIC[x];
                                else if (x < 16) cur = BRIGHT[x-8];
                                else if (x < 232) { int y=x-16; int L[6]={0,95,135,175,215,255}; cur=(L[(y/36)%6]<<16)|(L[(y/6)%6]<<8)|L[y%6]; }
                                else { int g=8+(x-232)*10; cur=(g<<16)|(g<<8)|g; }
                                i += 2;
                              } else if (cc == 38 && i+4 < n && code[i+1] == 2) {
                                cur = (code[i+2]<<16)|(code[i+3]<<8)|code[i+4]; i += 4;
                              }
                            }
                          }
                          continue;
                        } else if (*p == ']') { while (*p && (unsigned char)*p != 0x07) p++; if (*p) p++; continue; }
                        else if (*p) { p++; continue; }
                        continue;
                      }
                      if (c == '\r') { p++; continue; }
                      if (c == '\n') { if (span) { out += "#"; span = 0; } out += '\n'; lineCol = 0; runCh = 0; runLen = 0; pendingSp = 0; p++; continue; }
                      if (c < 0x20 && c != '\t') { p++; continue; }
                      char ch = 0; uint32_t fcol = 0; bool isThai = false; const char *us = 0; int ulen = 0;
                      if (c >= 0x80) {
                        us = p;
                        uint32_t cp = c; int len = 1;
                        if ((c & 0xE0) == 0xC0) { cp = c & 0x1F; len = 2; }
                        else if ((c & 0xF0) == 0xE0) { cp = c & 0x0F; len = 3; }
                        else if ((c & 0xF8) == 0xF0) { cp = c & 0x07; len = 4; }
                        for (int k = 1; k < len && p[k]; k++) cp = (cp << 6) | ((unsigned char) p[k] & 0x3F);
                        ulen = len; p += len;
                        if (cp >= 0x0E00 && cp <= 0x0E7F) isThai = true;
                        else if (cp == 0x2500 || cp == 0x2501 || cp == 0x2504 || cp == 0x2505 || cp == 0x2508 || cp == 0x2509 || cp == 0x254C || cp == 0x2014 || cp == 0x2015) ch = '-';
                        else if (cp == 0x2502 || cp == 0x2503 || cp == 0x2506 || cp == 0x250A || cp == 0x2551) ch = '|';
                        else if (cp >= 0x250C && cp <= 0x254B) ch = '+';
                        else if (cp >= 0x2580 && cp <= 0x259F) ch = '#';
                        else if (cp == 0x25B6 || cp == 0x25B8 || cp == 0x25BA || cp == 0x23F5 || cp == 0x2192 || cp == 0x27A4) ch = '>';
                        else if (cp == 0x25C0 || cp == 0x25C2 || cp == 0x25C4 || cp == 0x2190) ch = '<';
                        else if (cp == 0x2022 || cp == 0x25CF || cp == 0x25CB || cp == 0x00B7 || cp == 0x2219) ch = '*';
                        else if (cp == 0x2713 || cp == 0x2714 || cp == 0x2705) { ch = 'v'; fcol = 0x33CC55; }
                        else if (cp == 0x2717 || cp == 0x2718 || cp == 0x274C || cp == 0x274E) { ch = 'x'; fcol = 0xE03B3B; }
                        else if (cp == 0x2026) ch = '~';
                        else if (cp >= 0x2800 && cp <= 0x28FF) ch = ':';
                        else if (cp == 0x1F7E2 || cp == 0x1F7E9) { ch = '*'; fcol = 0x33CC55; }
                        else if (cp == 0x1F534 || cp == 0x1F7E5) { ch = '*'; fcol = 0xE03B3B; }
                        else if (cp == 0x1F7E1 || cp == 0x1F7E8) { ch = '*'; fcol = 0xE8C547; }
                        else if (cp == 0x1F7E0 || cp == 0x1F7E7) { ch = '*'; fcol = 0xE8862E; }
                        else if (cp == 0x1F535 || cp == 0x1F7E6) { ch = '*'; fcol = 0x3B82E0; }
                        else if (cp == 0x1F7E3 || cp == 0x1F7EA) { ch = '*'; fcol = 0xA050D0; }
                        else if (cp == 0x26AB) { ch = '*'; fcol = 0x808080; }
                        else if (cp == 0x26AA) { ch = 'o'; fcol = 0xC7C7C7; }
                        else ch = ' ';
                      } else { ch = (char) c; p++; }
                      int vis = lineCol++ - coff;
                      if (vis >= 0 && vis < VISCOLS) {
                        bool skip = false;
                        if (dcap > 0) {
                          bool ruler = (ch == '-' || ch == '=' || ch == '_' || ch == '~');
                          if (ruler && ch == runCh) { if (++runLen > dcap) skip = true; }
                          else { runCh = ruler ? ch : 0; runLen = ruler ? 1 : 0; }
                        }
                        if (!skip) {
                          if (isThai) {
                            while (pendingSp > 0) { out += ' '; pendingSp--; }
                            if (span != cur) {
                              if (span) out += "#";
                              if (cur) { char h[10]; snprintf(h, sizeof(h), "#%06X ", (unsigned) cur); out += h; }
                              span = cur;
                            }
                            out.append(us, ulen);
                          } else if (ch == ' ') { pendingSp++; }
                          else {
                            while (pendingSp > 0) { out += ' '; pendingSp--; }
                            uint32_t want = fcol ? fcol : cur;
                            if (span != want) {
                              if (span) out += "#";
                              if (want) { char h[10]; snprintf(h, sizeof(h), "#%06X ", (unsigned) want); out += h; }
                              span = want;
                            }
                            if (ch == '#') out += "##"; else out += ch;
                          }
                        }
                      }
                    }
                    if (span) out += "#";
                    int fill = id(lines_n);
                    int have = 1; for (char ch2 : out) if (ch2 == '\n') have++;
                    if (have < fill) out.insert(0, std::string(fill - have, '\n'));
                    static std::string last;
                    if (out != last) { last = out; lv_label_set_text_static(id(term), last.c_str()); }
                    char hb[96];
                    snprintf(hb, sizeof(hb), "%s  %s", id(g_ip).c_str(), id(target).c_str());
                    static std::string last_hdr;
                    if (hb != last_hdr) { last_hdr = hb; lv_label_set_text(id(hdr), hb); }
                    return true;
                  });

  - id: refresh_panes
    then:
      - http_request.get:
          url: "${ls_url}"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200 || body.length() < 2) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    static std::vector<std::string> store;
                    store.clear();
                    for (JsonObject s : root["sessions"].as<JsonArray>()) {
                      std::string sn = s["name"] | "";
                      if (sn.empty()) continue;
                      for (JsonObject w : s["windows"].as<JsonArray>()) {
                        std::string wn = w["name"] | "";
                        if (wn.empty()) continue;
                        store.push_back(sn + ":" + wn);
                      }
                    }
                    if (store.empty()) return true;
                    FixedVector<const char *> opts;
                    opts.init(store.size());
                    for (auto &s : store) opts.push_back(s.c_str());
                    id(pane_select).traits.set_options(opts);
                    if (!id(pane_select).active_index().has_value()) {
                      id(pane_select).publish_state(store[0]);
                      id(target) = store[0];
                    }
                    return true;
                  });

  - id: poll_loop
    mode: single
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - script.execute: fetch_pane
            - delay: !lambda 'return id(interval_s) * 1000;'
