# hello-psi.yaml — example ประกอบบทที่ 2 (lab/lessons/02-first-light.md)
#
# จอ: Guition JC3248W535 — ESP32-S3, AXS15231B 320x480 QSPI
# ทุก block ยกมาจาก config ที่พิสูจน์บนฮาร์ดแวร์แล้ว (lab/jc3248w535/jc3248w535.yaml)
#
#   cp ../../jc3248w535/secrets.yaml.example secrets.yaml   # เติม wifi
#   esphome run hello-psi.yaml

esphome:
  name: hello-psi
  friendly_name: Hello Psi

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # ดู log ผ่านพอร์ต native USB (usbmodem*)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Hello-Psi Fallback"
    password: !secret ap_fallback_password

captive_portal:

# ── QSPI bus ของ AXS15231 (quad: data 4 เส้น) ──────────────────────
spi:
  - id: lcd_spi
    type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

# ── Backlight: GPIO1, LEDC 25kHz (5kHz ของ vendor มีเสียงหวีดตอนหรี่) ──
output:
  - platform: ledc
    pin: 1
    id: backlight_pwm
    frequency: 25000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# ── Font: ประกาศ glyph เองทุกตัว — ตัวไหนไม่อยู่ใน glyphs จะหายเงียบ ──
font:
  - file: "gfonts://Roboto"
    id: noto_big
    size: 96
    glyphs: "ψ"
  - file: "gfonts://Roboto"
    id: noto_small
    size: 24
    glyphs: " abcdefghijklmnopqrstuvwxyz"

# ── ตัวจอ: vendor init 30+ คำสั่ง + DC-less framing ซ่อนอยู่หลัง model เดียว ──
display:
  - platform: mipi_spi
    model: AXS15231
    id: lcd
    spi_id: lcd_spi
    cs_pin: 45
    dimensions:
      width: 320
      height: 480
    color_order: rgb
    invert_colors: false
    data_rate: 40MHz
    lambda: |-
      it.fill(Color::BLACK);
      it.print(160, 200, id(noto_big), Color(0xFF, 0xC8, 0x00),
               TextAlign::CENTER, "ψ");
      it.print(160, 280, id(noto_small), Color::WHITE,
               TextAlign::CENTER, "first light");
