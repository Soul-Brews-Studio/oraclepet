; Original Anthropic config — kept commented for reference. Note: even
; this fails on current Arduino-ESP32 (3.3.8) — the m5stick-c board variant
; was removed (missing pins_arduino.h).
;
;   [env:m5stickc-plus]
;   board = m5stick-c
;   lib_deps = m5stack/M5StickCPlus
;
; ─────────────────────────────────────────────────────────────────────────
; Our retarget to JC3248W535EN (ESP32-S3 + AXS15231 320×480 QSPI).
; M5StickCPlus library dropped — that's where the M5.* refs in src/main.cpp
; will now blow up. Expected. Demonstrates "just swap board" doesn't work
; for hardware-specific embedded code.

[env:jc3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<sc01_smoke.cpp> +<buddies/>
lib_deps =
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; ─────────────────────────────────────────────────────────────────────────
; SC01 Plus LovyanGFX bring-up — standalone smoke test (no M5/buddy code).
; Verifies the screen+touch on the WT32-SC01 Plus via lgfx_sc01plus.h before
; the full M5StickCPlus→SC01 port. Builds ONLY src/sc01_smoke.cpp.
;   pio run -e wt32-sc01-plus-smoke -t upload -t monitor
[env:wt32-sc01-plus-smoke]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<sc01_smoke.cpp>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
