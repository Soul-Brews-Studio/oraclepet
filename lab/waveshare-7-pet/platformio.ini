; waveshare-7-pet -- the jc3248-pet desk-pet ported to the Waveshare
; ESP32-S3-Touch-LCD-7 (800x480 RGB). Same ESP32-S3 chip; only the display HAL
; differs (ws_7inch_rgb.h vs axs15231_qspi.h). pet.cpp/ble.cpp reused (ble.cpp's
; getValue() made portable with `auto`).
;
; Stack rationale: match the PROVEN somtor-meter config (env esp32s3-lcd7) EXACTLY
; for the RGB panel -- espressif32@6.9.0 (Arduino-ESP32 2.0.17) + Arduino_GFX 1.4.7.
; The earlier pioarduino/3.0.x + Arduino_GFX 1.5.x build compiled but the RGB panel
; came up BLANK; the esp_lcd RGB driver behaves differently across ESP-IDF versions,
; so use the version the board is proven on. LovyanGFX stays for the pet sprite.

[platformio]
default_envs = waveshare-7inch

[env:waveshare-7inch]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WAVESHARE_7INCH=1     ; selects ws_7inch_rgb.h
    -DLGFX_USE_V1=1               ; LovyanGFX sprite
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial -> HWCDC native USB
    -DBOARD_HAS_PSRAM
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0                       ; pet sprite framebuffer
    bitbank2/AnimatedGIF @ ^2.1.1                     ; GIF decode
    bblanchon/ArduinoJson @ ^7.0.0                    ; manifest.json palette
    moononournation/GFX Library for Arduino @ 1.4.7   ; RGB panel (PROVEN version on this board)
