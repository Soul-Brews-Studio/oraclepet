name: CardputerBLEReader
options:
  bundleIdPrefix: studio.soulbrews
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: "6K28WEXX78"
    CODE_SIGN_STYLE: Automatic
targets:
  CardputerBLEReader:
    type: application
    platform: iOS
    sources:
      - CardputerBLEReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.soulbrews.CardputerBLEReader
        INFOPLIST_FILE: CardputerBLEReader/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: CardputerBLEReader/Info.plist
      properties:
        CFBundleDisplayName: Cardputer BLE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Advertise as a Claude Buddy Nordic UART BLE receiver and read real bridge heartbeat JSON."
        NSBluetoothPeripheralUsageDescription: "Advertise as a Claude Buddy Nordic UART BLE receiver and read real bridge heartbeat JSON."
        NSLocalNetworkUsageDescription: "Read the Claude Home Python heartbeat feed from this Mac on the local network."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  CardputerBLEReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CardputerBLEReaderUITests
    dependencies:
      - target: CardputerBLEReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.soulbrews.CardputerBLEReaderUITests
        TEST_TARGET_NAME: CardputerBLEReader
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
