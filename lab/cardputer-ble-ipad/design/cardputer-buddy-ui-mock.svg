<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.5" stop-color="#0b0a12"/>
      <stop offset="1" stop-color="#160b08"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24272d"/>
      <stop offset="1" stop-color="#171920"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style><![CDATA[
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; fill: #fff; }
      .sub { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c5c8d0; }
      .mono { font-family: Menlo, Monaco, "SF Mono", "DejaVu Sans Mono", monospace; }
      .screenText { font-family: Menlo, Monaco, "SF Mono", "DejaVu Sans Mono", monospace; font-size: 9px; font-weight: 600; }
      .pill { font-family: Menlo, Monaco, "SF Mono", monospace; font-size: 15px; font-weight: 700; }
      .small { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; fill: #b8bbc4; }
      .label { font-family: Menlo, Monaco, "SF Mono", monospace; font-size: 14px; fill: #b8bbc4; }
    ]]></style>
  </defs>

  <rect width="1600" height="1180" fill="url(#page)"/>

  <text x="72" y="106" class="title" font-size="58">Claude Buddy · iPad BLE</text>
  <text x="72" y="150" class="sub" font-size="25">Draw first in HTML/SVG, then port to SwiftUI. The device mirror stays 240×135 and truth states stay visible.</text>
  <rect x="1202" y="72" width="218" height="29" rx="15" fill="#2b1d18" stroke="#cc785c"/>
  <text x="1215" y="93" class="pill" fill="#cc785c">HTML/SVG mockup first</text>
  <rect x="1202" y="121" width="124" height="27" rx="14" fill="#08262b" stroke="#00ffff"/>
  <text x="1216" y="141" class="pill" fill="#00ffff">SwiftUI final</text>

  <rect x="60" y="190" width="1480" height="630" rx="28" fill="url(#card)" stroke="#f0eee6" stroke-opacity="0.80" filter="url(#soft)"/>
  <text x="88" y="246" class="title" font-size="37">Cardputer screen mirror</text>
  <text x="88" y="284" class="sub" font-size="24">Exact visual contract from buddy_ui_cp.py: 240×135 landscape · 20px DARK header · orange hairlines · DejaVu9-like text · Y/N/Q hint strip.</text>

  <!-- large physical device bezel -->
  <rect x="118" y="316" width="800" height="500" rx="34" fill="#050506" stroke="#333"/>
  <rect x="148" y="346" width="742" height="430" rx="9" fill="#000" stroke="#333"/>

  <!-- idle cardputer screen, drawn at 3x from 240x135 coordinates -->
  <g transform="translate(170 360) scale(3)">
    <rect x="0" y="0" width="240" height="135" fill="#000000"/>
    <rect x="0" y="0" width="240" height="20" fill="#1f1f1f"/>
    <rect x="0" y="20" width="240" height="1" fill="#cc785c"/>
    <text x="6" y="14" class="screenText" fill="#cc785c">Claude Buddy</text>
    <text x="202" y="14" class="screenText" fill="#00ffff">ADV</text>
    <text x="6" y="38" class="screenText" fill="#f0eee6">Waiting to pair...</text>
    <text x="6" y="58" class="screenText" fill="#777777">Open Claude, go to</text>
    <text x="6" y="76" class="screenText" fill="#777777">Settings &gt; Buddy</text>
    <text x="6" y="94" class="screenText" fill="#777777">and pick this one</text>
    <rect x="0" y="111" width="240" height="1" fill="#cc785c"/>
    <rect x="0" y="112" width="240" height="23" fill="#1f1f1f"/>
    <text x="8" y="126" class="screenText" fill="#f0eee6">Y once</text>
    <text x="96" y="126" class="screenText" fill="#f0eee6">N deny</text>
    <text x="198" y="126" class="screenText" fill="#f0eee6">Q exit</text>
  </g>

  <text x="170" y="808" class="label">Idle/default screen: no fake counters; it only says how to pair until BLE proof exists.</text>

  <text x="960" y="322" class="title" font-size="34">When live BLE is proven</text>
  <text x="960" y="354" class="small">Queue/token rows are allowed only after CoreBluetooth writes to NUS RX.</text>
  <rect x="960" y="374" width="450" height="255" rx="16" fill="#090909" stroke="#cc785c" stroke-width="2"/>
  <g transform="translate(976 365) scale(1.65)">
    <rect x="0" y="0" width="240" height="135" fill="#000000"/>
    <rect x="0" y="0" width="240" height="20" fill="#1f1f1f"/>
    <rect x="0" y="20" width="240" height="1" fill="#cc785c"/>
    <text x="6" y="14" class="screenText" fill="#cc785c">Claude Buddy</text>
    <text x="198" y="14" class="screenText" fill="#00ff00">LINKED</text>
    <text x="6" y="34" class="screenText" fill="#cc785c">{name}</text>
    <text x="76" y="34" class="screenText" fill="#777777">&lt;- {owner}</text>
    <text x="6" y="50" class="screenText" fill="#ffffff">Q: {run}run {wait}wait {tot}tot</text>
    <text x="6" y="66" class="screenText" fill="#00ffff">Today: {tokens_today} tok</text>
    <text x="6" y="82" class="screenText" fill="#777777">{msg from live TX}</text>
    <text x="6" y="108" class="screenText" fill="#777777">Lv.0 a:0 d:0</text>
    <text x="205" y="108" class="screenText" fill="#f0eee6">100%</text>
    <rect x="0" y="111" width="240" height="1" fill="#cc785c"/>
    <rect x="0" y="112" width="240" height="23" fill="#1f1f1f"/>
    <text x="8" y="126" class="screenText" fill="#f0eee6">Y once</text>
    <text x="96" y="126" class="screenText" fill="#f0eee6">N deny</text>
    <text x="198" y="126" class="screenText" fill="#f0eee6">Q exit</text>
  </g>
  <text x="960" y="670" class="label">Placeholders above mean “bind from BLE rows”; they are not mock telemetry.</text>

  <rect x="960" y="704" width="450" height="86" rx="16" fill="#201614" stroke="#cc785c" stroke-opacity="0.70"/>
  <text x="986" y="735" class="title" font-size="23">SwiftUI target</text>
  <text x="986" y="764" class="small">Render this same 240×135 screen as a scaled component in the iPad app, beside the proof dashboard.</text>

  <rect x="60" y="864" width="1480" height="280" rx="28" fill="url(#card)" stroke="#f0eee6" stroke-opacity="0.80"/>
  <text x="88" y="928" class="title" font-size="36">Truth layer stays visible</text>
  <text x="88" y="966" class="sub" font-size="24">The iPad can be beautiful, but it must still prove whether data is draft, real BLE TX, or real device RX.</text>

  <g transform="translate(100 992)">
    <rect x="0" y="0" width="390" height="118" rx="18" fill="#2a211d" stroke="#cc785c" stroke-width="2"/>
    <text x="22" y="36" class="title" font-size="25">1 · Draft/local</text>
    <rect x="248" y="16" width="112" height="27" rx="14" fill="#3a241c" stroke="#cc785c"/>
    <text x="262" y="36" class="pill" fill="#cc785c">NOT SENT</text>
    <text x="22" y="72" class="small">iPad-generated test payload. Starts at zero</text>
    <text x="22" y="98" class="small">+ DRAFT TEST, not device truth.</text>
  </g>

  <g transform="translate(560 992)">
    <rect x="0" y="0" width="390" height="118" rx="18" fill="#1b2922" stroke="#00ff66" stroke-width="2"/>
    <text x="22" y="36" class="title" font-size="25">2 · Live BLE TX</text>
    <rect x="245" y="16" width="118" height="27" rx="14" fill="#08251a" stroke="#00ff66"/>
    <text x="260" y="36" class="pill" fill="#00ff66">REAL WRITE?</text>
    <text x="22" y="72" class="small">Only green after writeValue() to NUS RX.</text>
    <text x="22" y="98" class="small">Show UUID, bytes, chunks, SHA-256, OS ack.</text>
  </g>

  <g transform="translate(1020 992)">
    <rect x="0" y="0" width="390" height="118" rx="18" fill="#261b2e" stroke="#cc33ff" stroke-width="2"/>
    <text x="22" y="36" class="title" font-size="25">3 · Device RX</text>
    <rect x="245" y="16" width="130" height="27" rx="14" fill="#2b0d3b" stroke="#cc33ff"/>
    <text x="258" y="36" class="pill" fill="#cc33ff">REAL NOTIFY?</text>
    <text x="22" y="72" class="small">Only green after TX notify from buddy.</text>
    <text x="22" y="98" class="small">Empty means no device data arrived.</text>
  </g>
</svg>
