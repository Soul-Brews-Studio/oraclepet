; jc3248-pet — a fresh, minimal GIF pet for the Guition JC3248W535
; (ESP32-S3 + AXS15231 320x480 QSPI). Build env copied VERBATIM from the proven
; gallery (lab/jc3248-apps) — single board, native axs driver, no -DAPP dispatch.
; Do NOT add -DBOARD_ATD35_S3 (that dual-define is what dragged the buddy's M5 HAL in).

[platformio]
default_envs = jc3248w535c

[env:jc3248w535c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv          ; built-in PlatformIO scheme (no local file needed)
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_JC3248W535C=1
    -DLGFX_USE_V1=1
    -DLGFX_USE_QSPI=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1          ; GIF decode
    bblanchon/ArduinoJson @ ^7.0.0         ; manifest.json palette parse
