<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>oracle-face — JC3248W535EN brewing dashboard sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --bg: #04080a;
      --bg-grad: radial-gradient(circle at 30% 20%, #0b1f29 0%, #04080a 70%);
      --fg: #ccd6db;
      --muted: #5d6e75;
      --accent: #00ff7f;
      --orange: #ffd27f;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; }
    body { background: var(--bg-grad); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; gap: 24px; }
    h1 { font-weight: 300; font-size: 18px; margin: 0; letter-spacing: 0.04em; color: var(--muted); }
    h1 b { color: var(--accent); font-weight: 500; }
    .device {
      background: #0a1419;
      padding: 18px;
      border-radius: 32px;
      border: 1px solid #1f3540;
      box-shadow: 0 30px 60px -20px rgba(0,255,127,0.08), 0 10px 30px rgba(0,0,0,0.4);
    }
    canvas#canvas {
      display: block;
      width: 320px; height: 480px;
      border-radius: 14px;
      background: #000;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    .footer { font-size: 12px; color: var(--muted); text-align: center; max-width: 480px; line-height: 1.6; }
    .footer b { color: var(--orange); font-weight: 500; }
    .footer a { color: var(--accent); text-decoration: none; }
    .log {
      width: min(480px, 100%);
      height: 80px;
      background: #07101499;
      border: 1px solid #1f3540;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--muted);
      font: 11px ui-monospace, monospace;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ψ <b>oracle-face</b> — WASM simulator</h1>
  <div class="device">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="320" height="480"></canvas>
  </div>
  <div class="footer">
    Same LVGL render path as the hardware. ESP32-S3 + AXS15231 panel runs identically — just shipped to WebAssembly. <b>Mouse</b> = touch.<br>
    Source: <a href="https://github.com/Soul-Brews-Studio/esp32-oracle">Soul-Brews-Studio/esp32-oracle</a> · `lab/jc3248w535/sim/main_v2.c`
  </div>
  <pre class="log" id="output"></pre>

  <script>
    var Module = {
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. Reloading.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      print: (function() {
        var el = document.getElementById('output');
        return function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          el.textContent += text + '\n';
          el.scrollTop = el.scrollHeight;
        };
      })(),
      printErr: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
