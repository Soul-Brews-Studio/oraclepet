# ── Heartbeat: tick a counter every 2s, mirror to log + footer ─────
globals:
  - id: heartbeat_n
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 2s
    then:
      - lambda: |-
          id(heartbeat_n) += 1;
      - logger.log:
          format: "[%d] tending the flame..."
          args: ['id(heartbeat_n)']
      - lvgl.label.update:
          id: heartbeat
          text: !lambda |-
            char buf[48];
            snprintf(buf, sizeof(buf), "TENDING THE FLAME [%d]", id(heartbeat_n));
            return std::string(buf);
