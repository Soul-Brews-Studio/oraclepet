                  align: BOTTOM_MID
                  y: -4
                  text: "?.???"
                  text_color: 0x666666
                  text_font: noto_14
        - obj:
            x: 170
            y: 346
            width: 73
            height: 60
            bg_color: 0x0A1419
            bg_opa: COVER
