# JC3248W535 — Touch + Page Switch Demo
# Board: Guition JC3248W535 (ESP32-S3 + AXS15231 320x480 QSPI)
# 3 LVGL pages + bottom nav bar with touch buttons

esphome:
  name: jc3248-touch-demo
  friendly_name: JC3248 Touch Demo

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ── I2C for AXS15231 touch controller ──────────────
i2c:
  - id: touch_i2c
    sda: GPIO4
    scl: GPIO8
    frequency: 400kHz

# ── QSPI bus for AXS15231 display ──────────────────
spi:
  - id: lcd_spi
    type: quad
    clk_pin: GPIO47
    data_pins:
      - GPIO21
      - GPIO48
      - GPIO40
      - GPIO39

# ── Backlight on GPIO1 ─────────────────────────────
output:
  - platform: ledc
    pin: GPIO1
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# ── Touchscreen: AXS15231 capacitive (I2C 0x3B) ────
touchscreen:
  - platform: axs15231
    id: my_touch
    interrupt_pin: GPIO3
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d", touch.x, touch.y);

# ── Fonts ──────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 32
  - file: "gfonts://Roboto"
    id: font_body
    size: 20
  - file: "gfonts://Roboto"
    id: font_btn
    size: 18

# ── Display: AXS15231 over QSPI, 320x480 ───────────
display:
  - platform: mipi_spi
    model: AXS15231
    id: lcd
    spi_id: lcd_spi
    cs_pin: GPIO45
    dimensions:
      width: 320
      height: 480
    color_order: rgb
    invert_colors: false
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

# ── Tap counter ────────────────────────────────────
globals:
  - id: tap_count
    type: int
    restore_value: no
    initial_value: '0'

# ── LVGL: 3 pages + bottom nav bar ─────────────────
lvgl:
  displays:
    - lcd
  pages:
    # ═══ Page 1: HOME ══════════════════════════════
    - id: page_home
      bg_color: 0x0A0A1A
      bg_opa: COVER
      pad_all: 0
      radius: 0
      border_width: 0
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "HOME"
            text_color: 0xFFD27F
            text_font: font_title
        - label:
            id: lbl_counter
            align: CENTER
            y: -20
            text: "Taps: 0"
            text_color: 0x00FF7F
            text_font: font_body

    # ═══ Page 2: SENSORS ═══════════════════════════
    - id: page_sensors
      bg_color: 0x0A1A0A
      bg_opa: COVER
      pad_all: 0
      radius: 0
      border_width: 0
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "SENSORS"
            text_color: 0x4FB3FF
            text_font: font_title
        - label:
            align: CENTER
            y: -20
            text: "Temp: -- C"
            text_color: 0xFFFFFF
            text_font: font_body
        - label:
            align: CENTER
            y: 20
            text: "Humidity: -- %"
            text_color: 0xAAAAAA
            text_font: font_body

    # ═══ Page 3: INFO ══════════════════════════════
    - id: page_info
      bg_color: 0x1A0A0A
      bg_opa: COVER
      pad_all: 0
      radius: 0
      border_width: 0
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "INFO"
            text_color: 0xFF6B6B
            text_font: font_title
        - label:
            align: CENTER
            y: -20
            text: "JC3248W535"
            text_color: 0xFFFFFF
            text_font: font_body
        - label:
            align: CENTER
            y: 20
            text: "ESP32-S3 + AXS15231"
            text_color: 0x888888
            text_font: font_body

  # ═══ Bottom nav bar (always visible via top_layer) ═══
  top_layer:
    widgets:
      # ── HOME button ──
      - obj:
          align: BOTTOM_LEFT
          x: 8
          y: -8
          width: 96
          height: 48
          bg_color: 0x1F3540
          bg_opa: COVER
          border_width: 1
          border_color: 0xFFD27F
          radius: 10
          widgets:
            - label:
                align: CENTER
                text: "HOME"
                text_color: 0xFFD27F
                text_font: font_btn
          on_click:
            - lvgl.page.show: page_home

      # ── SENSORS button ──
      - obj:
          align: BOTTOM_MID
          y: -8
          width: 96
          height: 48
          bg_color: 0x0A1428
          bg_opa: COVER
          border_width: 1
          border_color: 0x4FB3FF
          radius: 10
          widgets:
            - label:
                align: CENTER
                text: "SENSORS"
                text_color: 0x4FB3FF
                text_font: font_btn
          on_click:
            - lvgl.page.show: page_sensors

      # ── INFO button ──
      - obj:
          align: BOTTOM_RIGHT
          x: -8
          y: -8
          width: 96
          height: 48
          bg_color: 0x280A0A
          bg_opa: COVER
          border_width: 1
          border_color: 0xFF6B6B
          radius: 10
          widgets:
            - label:
                align: CENTER
                text: "INFO"
                text_color: 0xFF6B6B
                text_font: font_btn
          on_click:
            - lvgl.page.show: page_info
